# Put this zone in the http{} context (this example file can be included there).
limit_req_zone $binary_remote_addr zone=tscwallet_api:10m rate=10r/s;

# Allow the public GitHub Pages verifier to read wallet build files. The API
# path is deliberately excluded from this CORS mapping.
map "$http_origin:$request_uri" $wallet_verifier_origin {
    default "";
    ~^https://rhuhui\.github\.io:/wallet/(?!api/) https://rhuhui.github.io;
}

server {
    listen 443 ssl http2;
    server_name app.example.org;

    # Replace with certificates provisioned by your TLS tooling.
    ssl_certificate /etc/letsencrypt/live/app.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.org/privkey.pem;

    root /var/www/tscwallet/current;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Access-Control-Allow-Origin $wallet_verifier_origin always;
    add_header Vary "Origin" always;

    location = / { return 302 /wallet/; }
    location = /wallet { return 301 /wallet/; }

    location ^~ /wallet/api/ {
        limit_req zone=tscwallet_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9920/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
        client_max_body_size 1m;
    }

    location ^~ /wallet/ {
        rewrite ^/wallet/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location ~ /\. { deny all; }
}
